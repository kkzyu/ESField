name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install check tools
        run: python -m pip install black ruff pyyaml
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate CITATION.cff
        run: python -c "import yaml; yaml.safe_load(open('CITATION.cff'))"
